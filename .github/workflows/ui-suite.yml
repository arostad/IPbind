name: UI suite

# Full UI + installer walk + copy / display-version checks. beta.yml's
# publish job needs this reusable workflow to pass on the same commit.
# Not used as a path-filtered or PR-only build: a push to
# privacy-update-optout, a PR into that branch, and a beta.yml call
# all run the whole suite. test-ui-* is the only place a newer run
# cancels an older one.
on:
  pull_request:
    branches: [privacy-update-optout]
  push:
    branches: [privacy-update-optout, 'test-ui-*']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/test-ui-') }}

jobs:
  prepare:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build IPbind Beta (warnings as errors)
        shell: pwsh
        run: |
          Remove-Item -ErrorAction SilentlyContinue .\IPbind.exe
          powershell -ExecutionPolicy Bypass -File .\Build-Exe.ps1 -Channel beta
          if (-not (Test-Path .\IPbind.exe)) { throw 'Build-Exe.ps1 did not produce IPbind.exe' }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path .\IPbind.exe).Path)
          if ($info.ProductName -ne 'IPbind Beta') { throw "Expected product 'IPbind Beta', got '$($info.ProductName)'" }
          Write-Host "Built $($info.ProductName) $($info.ProductVersion)"
      - name: Build uishot
        shell: pwsh
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $cargs = @(
            '/nologo','/warnaserror+','/target:winexe','/win32manifest:app.manifest','/win32icon:app-beta.ico',
            '/r:System.dll','/r:System.Core.dll','/r:System.Drawing.dll','/r:System.Net.Http.dll',
            '/r:System.Windows.Forms.dll','/main:IPbindTest.UiShot',
            '/resource:installer\privacy.txt,IPbind.privacy.txt',
            '/resource:app-beta.ico,IPbind.app.ico','/out:uishot.exe'
          )
          & $csc @cargs IPbind.cs Version.cs .github\test\UiShot.cs .github\test\ScaleControl.cs
          if ($LASTEXITCODE -ne 0) { throw 'uishot compile failed' }
      - name: Unit, display-version, and copy checks
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\.github\test\run-apply-safety-tests.ps1
          powershell -ExecutionPolicy Bypass -File .\.github\test\run-display-version-tests.ps1
          powershell -ExecutionPolicy Bypass -File .\.github\test\copy-check.ps1
          powershell -ExecutionPolicy Bypass -File .\.github\test\run-clip-fixtures.ps1
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress | Out-Null
          powershell -ExecutionPolicy Bypass -File .\Build-Installer.ps1 -Channel beta -ExePath .\IPbind.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-ChildItem .\dist\IPbind-Installer-v*-beta.exe)) { throw 'installer missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: ui-suite-build
          path: |
            IPbind.exe
            uishot.exe
            Version.cs
            dist/IPbind-Installer-v*-beta.exe
          if-no-files-found: error
          retention-days: 1

  ui:
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [static-shots, aboutcheck, simdpi, realdpi, dpirtrip, dpirtrip-139, main, scrollhide, flicker, walk-100, walk-150, walk-175, installer-clip, installer-clip-139]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-suite-build
          path: .
      - name: Place installer
        shell: pwsh
        run: |
          if (Test-Path .\dist) { } else { New-Item -ItemType Directory dist | Out-Null }
          Get-ChildItem -Recurse -Filter 'IPbind-Installer-v*-beta.exe' | ForEach-Object {
            if ($_.DirectoryName -ne (Join-Path $PWD 'dist')) {
              Copy-Item $_.FullName (Join-Path $PWD 'dist') -Force
            }
          }
          New-Item -ItemType Directory -Force shots | Out-Null
          $d = Join-Path $env:APPDATA 'IPbind Beta'
          New-Item -ItemType Directory -Force $d | Out-Null
          Set-Content (Join-Path $d 'dhcp-reminder-dismissed.txt') 'test'
          Set-Content (Join-Path $d 'update-check.txt') 'auto'
      - name: Run ${{ matrix.suite }}
        shell: pwsh
        run: |
          $suite = '${{ matrix.suite }}'
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ea Stop } catch { Write-Host $_ }
          $pers = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          New-Item -Force $pers -ea SilentlyContinue | Out-Null
          function SetScale([string]$pct, [string]$tag) {
            $r = Start-Process .\uishot.exe -ArgumentList @('setscale',$pct,"$PWD\shots\setscale-$tag.txt") -PassThru -Wait
            Start-Sleep -Seconds 3
            $txt = ''
            if (Test-Path "shots\setscale-$tag.txt") { $txt = Get-Content "shots\setscale-$tag.txt" -Raw }
            Write-Host "setscale $pct -> $txt"
            # Runner displays max out at 175%. Never request 200% and then keep
            # going with a lower scale under a 200% label.
            if ($txt -match 'UNAVAILABLE') { throw "setscale $pct unavailable: $txt (CI runner max is 175%)" }
          }
          switch ($suite) {
            'static-shots' {
              $fails = 0
              foreach ($pct in @('100','150','175')) {
                SetScale $pct $pct
                $sc = [string]([math]::Round([int]$pct / 100.0, 2))
                foreach ($theme in @('dark','light')) {
                  Set-ItemProperty $pers AppsUseLightTheme $(if ($theme -eq 'light') { 1 } else { 0 }) -Type DWord
                  foreach ($kind in @('about','popup')) {
                    $t = "$kind-$pct-$theme"
                    $p = Start-Process .\uishot.exe -ArgumentList @($kind,$(if ($theme -eq 'dark') { 'dark' } else { 'light' }),$sc,"$PWD\shots\$t.png","$PWD\shots\$t.txt") -PassThru -Wait
                    if ($p.ExitCode -ne 0) { $fails++; Write-Host "::error::$t exit $($p.ExitCode)" }
                  }
                }
              }
              if ($fails -gt 0) { throw "static shots failed $fails" }
            }
            'aboutcheck' {
              $p = Start-Process .\uishot.exe -ArgumentList @('aboutcheck',"$PWD\shots\aboutcheck","$PWD\shots\aboutcheck.txt") -PassThru -Wait
              Get-Content shots\aboutcheck.txt
              if ($p.ExitCode -ne 0) { throw "aboutcheck exit $($p.ExitCode)" }
            }
            'simdpi' {
              $p = Start-Process .\uishot.exe -ArgumentList @('dpi',"$PWD\shots\simdpi","$PWD\shots\simdpi.txt") -PassThru -Wait
              Get-Content shots\simdpi.txt
              if ($p.ExitCode -ne 0) { throw "sim dpi exit $($p.ExitCode)" }
            }
            'realdpi' {
              $p = Start-Process .\uishot.exe -ArgumentList @('realdpi',"$PWD\shots\realdpi","$PWD\shots\realdpi.txt") -PassThru -Wait
              Get-Content shots\realdpi.txt
              if ($p.ExitCode -ne 0) { throw "real dpi exit $($p.ExitCode)" }
            }
            'dpirtrip' {
              $p = Start-Process .\uishot.exe -ArgumentList @('dpirtrip',"$PWD\shots\dpirtrip","$PWD\shots\dpirtrip.txt") -PassThru -Wait
              Get-Content shots\dpirtrip.txt
              if ($p.ExitCode -ne 0) { throw "dpirtrip exit $($p.ExitCode)" }
            }
            'main' {
              $fails = 0
              foreach ($pct in @('100','150','175')) {
                SetScale $pct "main-$pct"
                foreach ($theme in @('light','dark')) {
                  Set-ItemProperty $pers AppsUseLightTheme $(if ($theme -eq 'light') { 1 } else { 0 }) -Type DWord
                  $t = "main-$pct-$theme"
                  $p = Start-Process .\uishot.exe -ArgumentList @('main',"$PWD\shots\$t.png","$PWD\shots\$t.txt") -PassThru -Wait
                  if ($p.ExitCode -ne 0) { $fails++; Write-Host "::warning::$t exit $($p.ExitCode)" }
                }
              }
              $unexpected = 0
              foreach ($pct in @('100','150')) {
                foreach ($theme in @('light','dark')) {
                  $t = "shots/main-$pct-$theme.txt"
                  if (Test-Path $t) {
                    if (Select-String -Path $t -Pattern 'MAIN_PROBLEMS=([1-9])') { $unexpected++ }
                  }
                }
              }
              if ($unexpected -gt 0) { throw "main shots failed unexpectedly $unexpected (100/150)" }
            }
            'scrollhide' {
              $fails = 0
              $runs = @(
                @{pct='100'; theme='dark'; tag='scrollhide-100-dark'},
                @{pct='150'; theme='dark'; tag='scrollhide-150-dark'},
                @{pct='175'; theme='dark'; tag='scrollhide-175-dark'},
                @{pct='100'; theme='light'; tag='scrollhide-100-light'},
                @{pct='100'; theme='dark'; tag='scrollhide-100-dark-after-175'}
              )
              foreach ($item in $runs) {
                SetScale $item.pct $item.tag
                Set-ItemProperty $pers AppsUseLightTheme $(if ($item.theme -eq 'light') { 1 } else { 0 }) -Type DWord
                $p = Start-Process .\uishot.exe -ArgumentList @('scrollhide',"$PWD\shots\$($item.tag)","$PWD\shots\$($item.tag).txt") -PassThru -Wait
                if (Test-Path "shots\$($item.tag).txt") { Get-Content "shots\$($item.tag).txt" }
                if ($p.ExitCode -ne 0) { $fails++; Write-Host "::error::$($item.tag) exit $($p.ExitCode)" }
              }
              if ($fails -gt 0) { throw "scrollhide failed $fails" }
            }
            'flicker' {
              $fails = 0
              Set-ItemProperty $pers AppsUseLightTheme 0 -Type DWord
              foreach ($pct in @('100','150')) {
                SetScale $pct "flicker-$pct"
                $t = "comboflicker-$pct-dark"
                $p = Start-Process .\uishot.exe -ArgumentList @('comboflicker',"$PWD\shots\$t","$PWD\shots\$t.txt") -PassThru -Wait
                if (Test-Path "shots\$t.txt") { Get-Content "shots\$t.txt" }
                if ($p.ExitCode -ne 0) { $fails++; Write-Host "::error::$t exit $($p.ExitCode)" }
              }
              if ($fails -gt 0) { throw "combo flicker failed $fails" }
            }
            'walk-100' {
              $d = Join-Path $env:APPDATA 'IPbind Beta'
              if (Test-Path $d) { Remove-Item -Recurse -Force $d }
              Set-ItemProperty $pers AppsUseLightTheme 0 -Type DWord
              SetScale '100' 'walk-100'
              $inst = (Get-ChildItem .\dist\IPbind-Installer-v*-beta.exe).FullName
              powershell -ExecutionPolicy Bypass -File .\.github\test\walk.ps1 -Installer $inst -Out "$PWD\shots\walk" -Tag w100
              if ($LASTEXITCODE -ne 0) { throw "walk 100 failed ($LASTEXITCODE)" }
            }
            'walk-150' {
              $d = Join-Path $env:APPDATA 'IPbind Beta'
              if (Test-Path $d) { Remove-Item -Recurse -Force $d }
              Set-ItemProperty $pers AppsUseLightTheme 0 -Type DWord
              SetScale '150' 'walk-150'
              $inst = (Get-ChildItem .\dist\IPbind-Installer-v*-beta.exe).FullName
              powershell -ExecutionPolicy Bypass -File .\.github\test\walk.ps1 -Installer $inst -Out "$PWD\shots\walk" -Tag w150
              if ($LASTEXITCODE -ne 0) { throw "walk 150 failed ($LASTEXITCODE)" }
            }
            'walk-175' {
              $d = Join-Path $env:APPDATA 'IPbind Beta'
              if (Test-Path $d) { Remove-Item -Recurse -Force $d }
              Set-ItemProperty $pers AppsUseLightTheme 0 -Type DWord
              SetScale '175' 'walk-175'
              $inst = (Get-ChildItem .\dist\IPbind-Installer-v*-beta.exe).FullName
              powershell -ExecutionPolicy Bypass -File .\.github\test\walk.ps1 -Installer $inst -Out "$PWD\shots\walk" -Tag w175
              if ($LASTEXITCODE -ne 0) { throw "walk 175 failed ($LASTEXITCODE)" }
            }
            'dpirtrip-139' {
              powershell -ExecutionPolicy Bypass -File .\.github\test\run-dpirtrip-139-regression.ps1
              if ($LASTEXITCODE -ne 0) { throw "dpirtrip-139 regression failed ($LASTEXITCODE)" }
            }
            'installer-clip' {
              $d = Join-Path $env:APPDATA 'IPbind Beta'
              if (Test-Path $d) { Remove-Item -Recurse -Force $d }
              Set-ItemProperty $pers AppsUseLightTheme 0 -Type DWord
              $inst = (Get-ChildItem .\dist\IPbind-Installer-v*-beta.exe).FullName
              $fails = 0
              foreach ($pct in @('100','150','175')) {
                SetScale $pct "installer-clip-$pct"
                $t = "ic$pct"
                $p = Start-Process powershell -ArgumentList @('-ExecutionPolicy','Bypass','-File','.\.github\test\installer-checkboxes.ps1','-Installer',$inst,'-Out',"$PWD\shots\installer-clip",'-Tag',$t) -PassThru -Wait
                $log = "$PWD\shots\installer-clip\installer-checkboxes-$t.txt"
                if (Test-Path $log) { Get-Content $log }
                if ($p.ExitCode -ne 0) { $fails++; Write-Host "::error::installer-clip $pct exit $($p.ExitCode)" }
              }
              if ($fails -gt 0) { throw "installer-clip failed $fails" }
            }
            'installer-clip-139' {
              $d = Join-Path $env:APPDATA 'IPbind Beta'
              if (Test-Path $d) { Remove-Item -Recurse -Force $d }
              Set-ItemProperty $pers AppsUseLightTheme 0 -Type DWord
              $inst = (Resolve-Path .\.github\test\fixtures\IPbind-Installer-v2.3.139-beta.exe).Path
              $expect = Get-Content .\.github\test\fixtures\IPbind-Installer-v2.3.139-beta.exe.sha256 -Raw
              $got = (Get-FileHash $inst -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($expect -notmatch $got) { throw "139 fixture hash $got did not match $expect" }
              $fails = 0
              # Live 139 installer at 150% and 175% (runner max). Andy's clip is at 225%,
              # which SetScale cannot reach. These runs record the detector honestly;
              # they must reach Tasks and Finish. The required 139 fail is the frozen
              # Finish-page fixture (run-clip-fixtures.ps1 in prepare).
              foreach ($pct in @('150','175')) {
                SetScale $pct "installer-clip-139-$pct"
                $t = "ic139-$pct"
                $p = Start-Process powershell -ArgumentList @('-ExecutionPolicy','Bypass','-File','.\.github\test\installer-checkboxes.ps1','-Installer',$inst,'-Out',"$PWD\shots\installer-clip-139",'-Tag',$t,'-AllowClip') -PassThru -Wait
                $log = "$PWD\shots\installer-clip-139\installer-checkboxes-$t.txt"
                if (Test-Path $log) { Get-Content $log }
                if ($p.ExitCode -ne 0) { $fails++; Write-Host "::error::installer-clip-139 $pct exit $($p.ExitCode)" }
              }
              if ($fails -gt 0) { throw "installer-clip-139 failed $fails (wizard must reach Tasks and Finish; the required 139 clip fail is the Finish fixture in prepare)" }
            }
            default { throw "unknown suite $suite" }

          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots-${{ matrix.suite }}
          path: shots/
          retention-days: 1
          if-no-files-found: warn
