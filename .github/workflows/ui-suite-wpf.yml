name: UI suite (WPF)

# WPF Beta checks. beta.yml's publish job needs this to pass on the same commit
# (alongside the WinForms ui-suite.yml, which still covers the shared engine).
# Runner displays max out at 175%: wpf-225 records that honestly and never
# labels a lower scale as 225%.
on:
  push:
    branches: [wpf-beta, 'test-wpf-*']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-suite-wpf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/test-wpf-') }}

jobs:
  prepare:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build IPbind Beta WPF (warnings as errors)
        shell: pwsh
        run: |
          Remove-Item -ErrorAction SilentlyContinue .\IPbind.exe
          $outp = powershell -ExecutionPolicy Bypass -File .\Build-Wpf.ps1 -Channel beta -OutPath .\IPbind.exe 2>&1 | Out-String
          Write-Host $outp
          if ($outp -match 'warning CS\d+|error CS\d+') { throw 'csc reported warnings or errors' }
          if (-not (Test-Path .\IPbind.exe)) { throw 'Build-Wpf.ps1 did not produce IPbind.exe' }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path .\IPbind.exe).Path)
          if ($info.ProductName -ne 'IPbind Beta') { throw "Expected product 'IPbind Beta', got '$($info.ProductName)'" }
          Write-Host "Built $($info.ProductName) $($info.ProductVersion) (WPF)"
      - name: Selftest
        shell: pwsh
        run: |
          $f = "$PWD\selftest.txt"
          $p = Start-Process .\IPbind.exe -ArgumentList @('--selftest', $f) -PassThru -Wait
          $txt = if (Test-Path $f) { Get-Content $f -Raw } else { '(no output)' }
          Write-Host "selftest exit $($p.ExitCode): $txt"
          if ($p.ExitCode -ne 0 -or $txt -notmatch 'SELFTEST OK') { throw 'WPF selftest failed' }
      - name: Build uishot (setscale helper)
        shell: pwsh
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $cargs = @(
            '/nologo','/warnaserror+','/target:winexe','/win32manifest:app.manifest','/win32icon:app-beta.ico',
            '/r:System.dll','/r:System.Core.dll','/r:System.Drawing.dll','/r:System.Net.Http.dll',
            '/r:System.Windows.Forms.dll','/main:IPbindTest.UiShot',
            '/resource:installer\privacy.txt,IPbind.privacy.txt',
            '/resource:app-beta.ico,IPbind.app.ico','/out:uishot.exe'
          )
          & $csc @cargs IPbind.cs Version.cs .github\test\UiShot.cs .github\test\ScaleControl.cs
          if ($LASTEXITCODE -ne 0) { throw 'uishot compile failed' }
      - name: Unit and display-version checks
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\.github\test\run-apply-safety-tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'apply-safety tests failed' }
          powershell -ExecutionPolicy Bypass -File .\.github\test\run-display-version-tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'display-version tests failed' }
      - name: Build installer from the WPF exe
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress | Out-Null
          powershell -ExecutionPolicy Bypass -File .\Build-Installer.ps1 -Channel beta -ExePath .\IPbind.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-ChildItem .\dist\IPbind-Installer-v*-beta.exe)) { throw 'installer missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: ui-suite-wpf-build
          path: |
            IPbind.exe
            uishot.exe
            Version.cs
            dist/IPbind-Installer-v*-beta.exe
          if-no-files-found: error
          retention-days: 1

  ui:
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [wpf-shots, wpf-dpirtrip, wpf-225, walk-100, walk-150, walk-175]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-suite-wpf-build
          path: .
      - name: Prepare
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $d = Join-Path $env:APPDATA 'IPbind Beta'
          New-Item -ItemType Directory -Force $d | Out-Null
          Set-Content (Join-Path $d 'dhcp-reminder-dismissed.txt') 'test'
          Set-Content (Join-Path $d 'update-check.txt') 'auto'
      - name: Run ${{ matrix.suite }}
        shell: pwsh
        run: |
          $suite = '${{ matrix.suite }}'
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ea Stop } catch { Write-Host $_ }
          $pers = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          New-Item -Force $pers -ea SilentlyContinue | Out-Null
          function SetScale([string]$pct, [string]$tag) {
            $r = Start-Process .\uishot.exe -ArgumentList @('setscale',$pct,"$PWD\shots\setscale-$tag.txt") -PassThru -Wait
            Start-Sleep -Seconds 3
            $txt = ''
            if (Test-Path "shots\setscale-$tag.txt") { $txt = Get-Content "shots\setscale-$tag.txt" -Raw }
            Write-Host "setscale $pct -> $txt"
            if ($txt -match 'UNAVAILABLE') { throw "setscale $pct unavailable: $txt (CI runner max is 175%)" }
          }
          function Walk([string]$pct) {
            $d = Join-Path $env:APPDATA 'IPbind Beta'
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
            Set-ItemProperty $pers AppsUseLightTheme 0 -Type DWord
            SetScale $pct "walk-$pct"
            $exes = @(Get-ChildItem .\dist\IPbind-Installer-v*-beta.exe)
            if ($exes.Count -ne 1) { throw "expected exactly one just-built Beta installer in dist, found $($exes.Count)" }
            powershell -ExecutionPolicy Bypass -File .\.github\test\walk.ps1 -Installer $exes[0].FullName -Out "$PWD\shots\walk" -Tag "w$pct"
            if ($LASTEXITCODE -ne 0) { throw "walk $pct failed ($LASTEXITCODE)" }
          }
          switch ($suite) {
            'wpf-shots' {
              $fails = 0
              foreach ($pct in @('100','150','175')) {
                SetScale $pct $pct
                foreach ($theme in @('dark','light')) {
                  Set-ItemProperty $pers AppsUseLightTheme $(if ($theme -eq 'light') { 1 } else { 0 }) -Type DWord
                  $dir = "$PWD\shots\uicheck-$pct-$theme"
                  $p = Start-Process .\IPbind.exe -ArgumentList @('--uicheck', $dir, '--theme', $theme) -PassThru -Wait
                  if (Test-Path "$dir\uicheck.txt") { Get-Content "$dir\uicheck.txt" }
                  if ($p.ExitCode -ne 0) { $fails++; Write-Host "::error::uicheck $pct $theme exit $($p.ExitCode)" }
                  powershell -ExecutionPolicy Bypass -File .\.github\test\wpf-shot.ps1 -Exe .\IPbind.exe -Out "$PWD\shots\launch" -Tag "$pct-$theme" -Theme $theme
                  if ($LASTEXITCODE -ne 0) { $fails++; Write-Host "::error::launch $pct $theme failed" }
                }
              }
              if ($fails -gt 0) { throw "wpf-shots failed $fails" }
            }
            'wpf-dpirtrip' {
              Set-ItemProperty $pers AppsUseLightTheme 0 -Type DWord
              SetScale '175' 'trip-start'
              powershell -ExecutionPolicy Bypass -File .\.github\test\wpf-shot.ps1 -Exe .\IPbind.exe -Out "$PWD\shots\dpirtrip" -Tag trip -Trip @('100','175')
              if ($LASTEXITCODE -ne 0) { throw 'wpf-dpirtrip failed' }
            }
            'wpf-225' {
              # Runner max is 175%. Ask for 225 without throwing; if unavailable,
              # say so and pass. 225% and 225<->100% drags are Andy/carbon checks.
              Start-Process .\uishot.exe -ArgumentList @('setscale','225',"$PWD\shots\setscale-225.txt") -Wait | Out-Null
              Start-Sleep -Seconds 3
              $txt = if (Test-Path shots\setscale-225.txt) { Get-Content shots\setscale-225.txt -Raw } else { '' }
              Write-Host "setscale 225 -> $txt"
              if ($txt -match 'UNAVAILABLE' -or -not $txt) {
                Write-Host '::notice::225% unavailable on the CI runner; 225% and 225<->100% drag are Andy/carbon checks only.'
              } else {
                powershell -ExecutionPolicy Bypass -File .\.github\test\wpf-shot.ps1 -Exe .\IPbind.exe -Out "$PWD\shots\s225" -Tag 225 -Trip @('100','225')
                if ($LASTEXITCODE -ne 0) { throw 'wpf-225 failed' }
              }
            }
            'walk-100' { Walk '100' }
            'walk-150' { Walk '150' }
            'walk-175' { Walk '175' }
            default { throw "unknown suite $suite" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots-wpf-${{ matrix.suite }}
          path: shots/
          retention-days: 1
          if-no-files-found: warn
