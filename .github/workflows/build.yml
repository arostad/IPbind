name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build IPbind.exe
        shell: pwsh
        run: |
          Remove-Item -ErrorAction SilentlyContinue .\IPbind.exe
          powershell -ExecutionPolicy Bypass -File .\Build-Exe.ps1

      - name: Write release metadata
        shell: pwsh
        run: |
          $script = Get-Content -Raw .\Build-Exe.ps1
          $versionMatch = [regex]::Match($script, "(?m)^\`$Version\s*=\s*'([^']+)'")
          if (-not $versionMatch.Success) {
            throw 'Could not read $Version from Build-Exe.ps1.'
          }
          Set-Content -Path .\version.txt -Value $versionMatch.Groups[1].Value -NoNewline
          $hash = (Get-FileHash -Path .\IPbind.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path .\IPbind.exe.sha256 -Value "$hash  IPbind.exe" -NoNewline

      - name: Install Inno Setup 6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build per-user installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\Build-Installer.ps1 -ExePath .\IPbind.exe

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: IPbind
          path: |
            IPbind.exe
            IPbind.exe.sha256
            version.txt
            dist/IPbind-Setup.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: IPbind
          path: ./release

      - name: Update Latest release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest
          name: Latest
          body: |
            **Portable — IPbind.exe:** primary single-file download.

            **Installer — IPbind-Setup.exe:** matching per-user installer.

            Both downloads are refreshed together on every push to main.
          files: |
            release/IPbind.exe
            release/IPbind.exe.sha256
            release/version.txt
            release/dist/IPbind-Setup.exe
          make_latest: true
