name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build IPbind.exe
        shell: pwsh
        run: |
          Remove-Item -ErrorAction SilentlyContinue .\IPbind.exe
          powershell -ExecutionPolicy Bypass -File .\Build-Exe.ps1

      - name: Run Apply-safety unit tests
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\.github\test\run-apply-safety-tests.ps1

      - name: Write release metadata
        shell: pwsh
        run: |
          $script = Get-Content -Raw .\Build-Exe.ps1
          $versionMatch = [regex]::Match($script, "(?m)^\`$Version\s*=\s*'([^']+)'")
          if (-not $versionMatch.Success) {
            throw 'Could not read $Version from Build-Exe.ps1.'
          }
          $version = $versionMatch.Groups[1].Value
          Set-Content -Path .\version.txt -Value $version -NoNewline
          # Updater assets (names must never change: existing installs fetch these).
          $hash = (Get-FileHash -Path .\IPbind.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path .\IPbind.exe.sha256 -Value "$hash  IPbind.exe" -NoNewline
          # User-facing portable download (same bytes as IPbind.exe). Unversioned on
          # purpose: the updater replaces the exe in place, keeping its filename.
          $portable = "IPbind-Portable.exe"
          Copy-Item .\IPbind.exe ".\$portable" -Force
          Set-Content -Path ".\$portable.sha256" -Value "$hash  $portable" -NoNewline

      # README download links must name the files this version publishes. Runs on
      # every push and PR, and the release job needs this job, so a stale README
      # fails the build and can never reach the Latest release.
      - name: Check README download links match version
        shell: pwsh
        run: |
          $version = Get-Content -Raw .\version.txt
          $readme = Get-Content -Raw .\README.md
          $base = 'https://github.com/arostad/IPbind/releases/download/latest/'
          $errors = @()
          foreach ($name in @("IPbind-Installer-v$version.exe", "IPbind-Portable.exe")) {
            if (-not $readme.Contains("[$name]($base$name)")) {
              $errors += "README is missing the link [$name]($base$name)"
            }
          }
          foreach ($m in [regex]::Matches($readme, 'IPbind-Installer-v([0-9][0-9.]*[0-9])\.exe')) {
            if ($m.Groups[1].Value -ne $version) {
              $errors += "README names $($m.Value) but Build-Exe.ps1 version is $version"
            }
          }
          if ($readme -match 'IPbind-Portable-v') {
            $errors += "README names a versioned portable file; the portable download is IPbind-Portable.exe"
          }
          if ($readme -notmatch "(?m)^Current version: \*\*$([regex]::Escape($version))\*\*\s*$") {
            $errors += "README 'Current version' line does not say $version (no trailing period)"
          }
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host "README download links match $version"

      # The installer is built on every push and PR so ISCC errors surface before
      # merge; only the release job (main pushes) publishes it.
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build per-user installer
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\Build-Installer.ps1 -ExePath .\IPbind.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = Get-Content -Raw .\version.txt
          $installer = "IPbind-Installer-v$version.exe"
          if (-not (Test-Path ".\dist\$installer")) { throw "Missing dist\$installer" }
          $hash = (Get-FileHash -Path ".\dist\$installer" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path ".\dist\$installer.sha256" -Value "$hash  $installer" -NoNewline

      # 128 install + exe-only swap + new installer helper must refresh
      # unins000.exe/.dat and write /IPBINDPROMPT. File/registry assertions
      # here; the UI suite checks the pre-uninstall prompt itself.
      - name: Upgrade-then-uninstall regression (2.3.128 in-app update)
        shell: pwsh
        run: |
          $version = Get-Content -Raw .\version.txt
          $installer = ".\dist\IPbind-Installer-v$version.exe"
          powershell -ExecutionPolicy Bypass -File .\.github\test\run-upgrade-uninstaller.ps1 `
            -NewExe .\IPbind.exe -NewInstaller $installer -SkipPrompt

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: IPbind
          path: |
            IPbind.exe
            IPbind.exe.sha256
            version.txt
            IPbind-Portable.exe
            IPbind-Portable.exe.sha256
            dist/IPbind-Installer-v*.exe
            dist/IPbind-Installer-v*.exe.sha256
            dist/IPbind-Setup.exe
          if-no-files-found: error
          retention-days: 1

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: IPbind
          path: ./release

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $version = (Get-Content -Raw .\release\version.txt).Trim()
          if ($version -notmatch '^\d+(?:\.\d+){2,3}$') { throw "Bad version '$version'" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # A push that does not bump the version (README-only merge, re-run) must not
      # replace the moving Latest assets with a new compile of a version that has
      # already shipped (Nov 13 2026: a README merge rebuilt Latest 2.3.142 with a
      # different SHA-256). If v<version> already exists, Latest must already be that
      # version: leave both untouched. If v<version> exists but Latest is something
      # else, stop for a human instead of guessing.
      - name: Skip Latest if this version already shipped
        id: guard
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          gh release view "v$env:VERSION" -R $repo --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "v$env:VERSION does not exist yet; publishing Latest."
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $dir = Join-Path $env:RUNNER_TEMP 'latest-version'
          New-Item -ItemType Directory -Force $dir | Out-Null
          gh release download latest -R $repo --pattern version.txt --dir $dir --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not read version.txt from the Latest release.' }
          $published = (Get-Content -Raw (Join-Path $dir 'version.txt')).Trim()
          if ($published -ne $env:VERSION) {
            throw "v$env:VERSION already exists but Latest is '$published'. Bump the version or fix Latest by hand; not overwriting."
          }
          Write-Host "::notice::v$env:VERSION already shipped and Latest is $published; leaving Latest assets unchanged (bump the version to publish a new build)."
          "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Update Latest release
        if: steps.guard.outputs.skip != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest
          name: Latest
          body: |
            **Download installer: [IPbind-Installer-v${{ steps.ver.outputs.version }}.exe](https://github.com/arostad/IPbind/releases/download/latest/IPbind-Installer-v${{ steps.ver.outputs.version }}.exe)**

            The Installer is recommended. IPbind asks for administrator approval when it starts, because Windows requires it to change adapter settings.

            <sub>Prefer a single file? Portable: [IPbind-Portable.exe](https://github.com/arostad/IPbind/releases/download/latest/IPbind-Portable.exe)</sub>
          # IPbind.exe, IPbind.exe.sha256 and version.txt are the in-app updater's
          # assets; IPbind-Setup.exe is a legacy unversioned installer name.
          files: |
            release/IPbind.exe
            release/IPbind.exe.sha256
            release/version.txt
            release/IPbind-Portable.exe
            release/IPbind-Portable.exe.sha256
            release/dist/IPbind-Installer-v${{ steps.ver.outputs.version }}.exe
            release/dist/IPbind-Installer-v${{ steps.ver.outputs.version }}.exe.sha256
            release/dist/IPbind-Setup.exe
          fail_on_unmatched_files: true
          make_latest: true

      # The latest tag is reused, so remove installers from older versions (and any
      # stray versioned portable) after the new files are up. Same-named assets such
      # as IPbind-Portable.exe are overwritten by the upload above. Updater and
      # legacy assets are never touched.
      - name: Remove previous versioned downloads
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $keep = @("IPbind-Installer-v$env:VERSION.exe", "IPbind-Installer-v$env:VERSION.exe.sha256")
          $assets = gh release view latest -R $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw 'Could not list Latest release assets.' }
          foreach ($name in $assets) {
            if ($name -match '^IPbind-(Installer|Portable)-v' -and $keep -notcontains $name) {
              Write-Host "Deleting stale asset $name"
              gh release delete-asset latest $name -R $env:GITHUB_REPOSITORY --yes
              if ($LASTEXITCODE -ne 0) { throw "Could not delete $name" }
            }
          }

      # Permanent per-version release (vX.Y.Z) so links such as winget's never break.
      # Created once and never touched again: README-only re-runs of the same version
      # skip it. --latest=false keeps the "latest" tag release as GitHub's Latest,
      # which beta.yml checks and releases/latest/download relies on.
      - name: Create permanent version release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $repo = $env:GITHUB_REPOSITORY
          gh release view $tag -R $repo --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already exists; leaving it unchanged."
          } else {
            $installer = "IPbind-Installer-v$env:VERSION.exe"
            $base = "https://github.com/$repo/releases/download/$tag"
            @(
              "IPbind $env:VERSION. This release is permanent, so its download links never change. For the current version, use the [Latest release](https://github.com/$repo/releases/tag/latest).",
              "",
              "**Installer: [$installer]($base/$installer)**",
              "",
              "<sub>Portable: [IPbind-Portable.exe]($base/IPbind-Portable.exe)</sub>"
            ) | Set-Content -Path .\version-notes.md -Encoding utf8
            gh release create $tag -R $repo --target $env:GITHUB_SHA --title "IPbind $env:VERSION" `
              --notes-file .\version-notes.md --latest=false `
              ".\release\dist\$installer" ".\release\dist\$installer.sha256" `
              .\release\IPbind-Portable.exe .\release\IPbind-Portable.exe.sha256
            if ($LASTEXITCODE -ne 0) { throw "Could not create release $tag" }
          }
          $latestTag = gh api "repos/$repo/releases/latest" --jq .tag_name
          if ($LASTEXITCODE -ne 0 -or $latestTag -ne 'latest') {
            throw "GitHub Latest release is '$latestTag', expected 'latest'"
          }
          Write-Host "GitHub Latest release is still 'latest'."
