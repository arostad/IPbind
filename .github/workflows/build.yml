name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build IPbind.exe
        shell: pwsh
        run: |
          Remove-Item -ErrorAction SilentlyContinue .\IPbind.exe
          powershell -ExecutionPolicy Bypass -File .\Build-Exe.ps1

      - name: Upload IPbind.exe
        uses: actions/upload-artifact@v4
        with:
          name: IPbind
          path: IPbind.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: IPbind
          path: ./release

      - name: Update Latest release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest
          name: Latest
          body: |
            Windows build of IPbind.
            This file is replaced on every push to main.
          files: release/IPbind.exe
          make_latest: true
