name: Build installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build per-user installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\Build-Installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPbind-Setup
          path: |
            dist/IPbind-Setup-*.exe
            dist/IPbind-Setup.exe
          if-no-files-found: error

      - name: Upload installer to Latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest .\dist\IPbind-Setup.exe --clobber
