# Throwaway: real-user walkthrough of the published Beta 2.3.137 installer.
name: walk release 137
on:
  push:
    branches: [test-walk-137]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  walk:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build setscale helper
        shell: pwsh
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /target:exe /out:setscale.exe .github\test\ScaleControl.cs .github\test\SetScaleMain.cs
          if ($LASTEXITCODE -ne 0) { throw 'setscale compile failed' }
      - name: Verify 2.3.136 fixture and download published 2.3.137 installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $fix = 'fixtures\v2.3.136-beta\IPbind-Installer-v2.3.136-beta.exe'
          $want = (Get-Content 'fixtures\v2.3.136-beta\IPbind-Installer-v2.3.136-beta.exe.sha256').Split()[0].Trim().ToLower()
          $got = (Get-FileHash $fix -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($got -ne $want) { throw "136 fixture hash $got != $want" }
          New-Item -ItemType Directory -Force published | Out-Null
          gh release download beta -R arostad/IPbind --dir published --pattern 'IPbind-Installer-v2.3.137-beta.exe*' --clobber
          $inst = 'published\IPbind-Installer-v2.3.137-beta.exe'
          if (-not (Test-Path $inst)) { throw 'published 137 installer missing' }
          $want137 = (Get-Content "$inst.sha256").Split()[0].Trim().ToLower()
          $got137 = (Get-FileHash $inst -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($got137 -ne $want137) { throw "137 installer hash $got137 != $want137" }
          Write-Host "137 installer ok $got137"
      - name: Real-user walkthrough of the published installer
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ea Stop } catch { Write-Host $_ }
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' AppsUseLightTheme 0 -Type DWord
          New-Item -ItemType Directory -Force shots | Out-Null
          powershell -ExecutionPolicy Bypass -File .\.github\test\walk-release-137.ps1 `
            -Installer136 (Resolve-Path 'fixtures\v2.3.136-beta\IPbind-Installer-v2.3.136-beta.exe').Path `
            -Installer137 (Resolve-Path 'published\IPbind-Installer-v2.3.137-beta.exe').Path `
            -Out "$PWD\shots" `
            -SetScale "$PWD\setscale.exe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walk-release-137
          path: shots/
          retention-days: 1
